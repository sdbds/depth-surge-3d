name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==25.1.0 flake8 mypy

      - name: Check formatting with black
        run: |
          black --check src/ tests/ app.py

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ app.py --count --show-source --statistics

      - name: Run type checking
        run: mypy src/depth_surge_3d --ignore-missing-imports

  wheels:
    uses: ./.github/workflows/quality-native-wheels.yml

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: wheels
    # A different ABI failing must not hide a valid Linux x64 test result.
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download this run's ABI-checked Linux CPython 3.11 wheel
        uses: actions/download-artifact@v4
        with:
          name: quality-native-Linux-X64-py3.11
          path: ${{ runner.temp }}/wheelhouse

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1

      - name: Export locked dependency versions
        run: |
          python -m pip install "uv==0.13.1"
          uv export --locked --no-dev --no-emit-project --no-hashes \
            --no-emit-package torch --no-emit-package torchvision \
            --output-file "$RUNNER_TEMP/runtime-constraints.txt" >/dev/null
          uv export --locked --only-dev --no-emit-project \
            --output-file "$RUNNER_TEMP/test-tools.txt" >/dev/null

      - name: Create clean runtime environment
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-venv
          echo "$RUNNER_TEMP/wheel-venv/bin" >> "$GITHUB_PATH"
          wheels=("$RUNNER_TEMP"/wheelhouse/*.whl)
          [[ ${#wheels[@]} -eq 1 && -f "${wheels[0]}" ]]
          echo "WHEEL=${wheels[0]}" >> "$GITHUB_ENV"

      - name: Install the exact wheel and its complete base dependencies
        id: installed
        working-directory: ${{ runner.temp }}
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          python -m pip install --constraint runtime-constraints.txt \
            -r "$GITHUB_WORKSPACE/.github/workflows/linux-cp311-cpu.txt" "$WHEEL"
          python -m pip check
          python -I -c "import torch; assert torch.version.cuda is None, torch.__version__"

      - name: Run installed CLI and render one Quality frame offline
        working-directory: ${{ runner.temp }}
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -I "$GITHUB_WORKSPACE/scripts/verify_installed_quality.py" --wheel "$WHEEL"

      - name: Install test tools
        id: tools
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        run: python -m pip install --require-hashes -r "$RUNNER_TEMP/test-tools.txt"

      # Benchmarks also read Git provenance. Keep a separate checkout for
      # those fixtures, but redirect its legacy src.* imports to the wheel.
      - name: Stage test fixtures beside the installed code
        id: fixtures
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          git worktree add --quiet --detach "$RUNNER_TEMP/contracts" HEAD
          mv "$RUNNER_TEMP/contracts/src/depth_surge_3d" "$RUNNER_TEMP/unused-source-package"
          test -z "$(find "$RUNNER_TEMP/contracts" -maxdepth 1 -name '_quality_kd_native.*' -print -quit)"
          package=$(python -I -c "from importlib.metadata import distribution; print(distribution('depth-surge-3d').locate_file('depth_surge_3d').resolve(strict=True))")
          ln -s "$package" "$RUNNER_TEMP/contracts/src/depth_surge_3d"
          # The benchmark rejects unknown symlinks. Record this intentional
          # replacement in the disposable worktree's own index, not the checkout.
          git -C "$RUNNER_TEMP/contracts" add -- src/depth_surge_3d
          echo "INSTALLED_PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Run unit tests with installed-package coverage
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/contracts
        env:
          COVERAGE_FILE: ${{ runner.temp }}/unit.coverage
        run: >-
          python -m pytest --import-mode=importlib -o pythonpath=src tests/unit
          --cov="$INSTALLED_PACKAGE" --cov-report="xml:$GITHUB_WORKSPACE/coverage.xml"
          --cov-report=term

      - name: Run integration tests against the installation
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/contracts
        run: python -m pytest --import-mode=importlib -o pythonpath=src tests/integration

      - name: Enforce 85 percent unit coverage
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/contracts
        env:
          COVERAGE_FILE: ${{ runner.temp }}/unit.coverage
        run: python -m coverage report --format=total --precision=2 --fail-under=85

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependency scanner
        run: python -m pip install safety "uv==0.13.1"

      - name: Check dependencies for vulnerabilities
        continue-on-error: true
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes \
            --output-file "$RUNNER_TEMP/audit-requirements.txt" >/dev/null
          safety check --json -r "$RUNNER_TEMP/audit-requirements.txt"
