name: Quality Native Wheels

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-native-wheel:
    name: ${{ matrix.runner }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build platform wheel with isolated build dependencies
        run: python -m pip wheel --no-deps --wheel-dir "${{ runner.temp }}/wheelhouse" .

      # This gate covers the native ABI, not the model stack. In particular,
      # not all third-party depth backends publish Linux ARM64 wheels.
      - name: Verify installed native ABI outside the checkout
        working-directory: ${{ runner.temp }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          from tempfile import TemporaryDirectory

          wheel, = Path("wheelhouse").resolve().glob("*.whl")
          verify = Path(os.environ["GITHUB_WORKSPACE"]) / "scripts" / "verify_installed_quality.py"
          with TemporaryDirectory(dir=Path.cwd()) as temp:
              env = Path(temp) / "venv"
              python = env / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run([sys.executable, "-I", "-m", "venv", env], cwd=temp, check=True)
              subprocess.run([python, "-I", "-m", "pip", "install", "--no-index", "--no-deps", wheel],
                             cwd=temp, check=True)
              subprocess.run([python, "-I", verify, "--wheel", wheel, "--native-only"],
                             cwd=temp, check=True)

      - name: Upload prebuilt wheel
        uses: actions/upload-artifact@v4
        with:
          name: quality-native-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/wheelhouse/*.whl
          if-no-files-found: error

      - name: Check the Windows installer entry point
        if: runner.os == 'Windows' && matrix.python == '3.11'
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/installer-contracts
        run: |
          python -m pip install "uv==0.13.1"
          uv run --locked --only-dev --python 3.11 python -I -m pytest --noconftest tests/unit/test_install_uv_qinglong.py
