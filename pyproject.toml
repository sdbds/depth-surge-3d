[project]
name = "depth-surge-3d"
version = "0.9.1"
description = "Convert 2D videos to immersive 3D VR format using advanced AI depth estimation"
authors = [
    { name = "Zirteq", email = "zirteq111@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch==2.13.0",
    "torchvision>=0.15.0",
    "xformers; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "flash-attn==2.8.3.post1; sys_platform == 'linux'",
    "triton-windows; sys_platform == 'win32' and python_version == '3.11'",
    "flash-attn==2.8.4; sys_platform == 'win32' and python_version == '3.11'",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0,<2.0.0",
    "Pillow>=10.0.0",
    "transformers>=4.56.0,<5",
    "diffusers>=0.35.1",
    "accelerate>=0.34.0",
    "safetensors>=0.4.0",
    "PyYAML>=6.0",
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "eventlet>=0.35.0",
    "six>=1.16.0",
    "einops>=0.7.0",
    "easydict>=1.9",
    "matplotlib>=3.7.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.7",
    "decord>=0.6.0",
    "depth-anything-3",
]

[project.scripts]
depth-surge-3d = "depth_surge_3d:main"

[project.urls]
Homepage = "https://github.com/Tok/depth-surge-3d"
Repository = "https://github.com/Tok/depth-surge-3d"
Issues = "https://github.com/Tok/depth-surge-3d/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "black==25.1.0",
    "flake8>=7.2.0",
    "mypy>=1.0.0",
]

[tool.uv.sources]
depth-anything-3 = { git = "https://github.com/ByteDance-Seed/Depth-Anything-3" }
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
xformers = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]
flash-attn = [
    { url = "https://github.com/sdbds/flash-attention-for-windows/releases/download/2.8.4/flash_attn-2.8.4+cu130torch2.13.0cxx11abiFALSEfullbackward-cp311-cp311-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.11'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Default excludes
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 127
max-complexity = 10
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]
